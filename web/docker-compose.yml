services:
  backend:
    build: .
    container_name: offerflow-backend
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-offerflow-secret-key-change-in-production}
      - DATABASE_URL=sqlite:///./offerflow.db
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-default}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
      - UVICORN_RELOAD=false
    volumes:
      - ./offerflow.db:/app/offerflow.db
      - ./chroma_db:/app/chroma_db
      - ./backend/app/core/salary_benchmark_data.json:/app/backend/app/core/salary_benchmark_data.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: offerflow-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: offerflow-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Shanghai
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: offerflow-postgres
    environment:
      POSTGRES_DB: offerflow
      POSTGRES_USER: offerflow
      POSTGRES_PASSWORD: offerflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  n8n-data:
  postgres-data:

